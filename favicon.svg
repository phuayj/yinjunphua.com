  <title id="t">Neuro-symbolic researcher icon</title>
  <desc id="d">A brain split into two hemispheres with a gap. Left: smooth lobes and a soft, weighted neural network (subsymbolic knowledge). Right: faceted lobes and a crisp proof rule, two premises over an inference bar yielding a conclusion (symbolic reasoning). A single port in the gap is their only connection.</desc>
